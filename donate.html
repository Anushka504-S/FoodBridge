<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Donate Food | FoodBridge</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

<header>
    <nav>
        <div class="logo">
            <i class="fa-solid fa-bowl-food"></i>
            FoodBridge
        </div>

        <ul>
            <li><a href="index.html">Home</a></li>
            <li><a href="donate.html">Donate</a></li>
            <li><a href="volunteer.html">Volunteer</a></li>
            <li><a href="about.html">About</a></li>
            <li><a href="contact.html">Contact</a></li>
        </ul>

    </nav>
</header>
<section class="donate-hero">

    <div class="donate-content">

        <h1>Donate Food</h1>

        <p>
            Every meal you donate can bring a smile to someone's face.
            Join FoodBridge and make a difference today.
        </p>

    </div>

</section>

<section class="donation-form">

    <h2>Food Donation Form</h2>

    <form>

        <label>Full Name</label>
        <input type="text" placeholder="Enter your name">

        <label>Email</label>
        <input type="email" placeholder="Enter your email">

        <label>Phone Number</label>
        <input type="tel" placeholder="Enter your phone number">

        <label>Food Type</label>
        <select>
            <option>Select Food Type</option>
            <option>Cooked Food</option>
            <option>Raw Food</option>
            <option>Packaged Food</option>
            <option>Fruits & Vegetables</option>
        </select>

        <label>Quantity</label>
        <input type="text" placeholder="Example: 20 Meals">

        <label>Pickup Address</label>
        <textarea placeholder="Enter pickup address"></textarea>

        <button type="submit">Donate Now</button>

    </form>

</section>

<footer>

<p>
© 2026 FoodBridge | All Rights Reserved
</p>

</footer>



</body>
</html>


</body>

</html>
